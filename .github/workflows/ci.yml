name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main, master, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Set Maven version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          chmod +x mvnw
          ./mvnw -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build with Maven
        run: chmod +x mvnw && ./mvnw -B clean package -DskipTests

      - name: Run tests
        run: ./mvnw -B test
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports
          retention-days: 7

      - name: Upload Maven artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: |
            target/*.jar
            pom.xml
          retention-days: 90

  build-docker:
    name: Build Docker Image (GHCR)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Set Maven version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          chmod +x mvnw
          ./mvnw -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build with Maven
        run: chmod +x mvnw && ./mvnw -B clean package -DskipTests

      - name: Prepare JAR for Docker context
        run: |
          JAR=$(ls target/spring-boot-guru-*.jar | grep -v -- -sources.jar | grep -v -- -javadoc.jar | head -1)
          test -n "$JAR"
          cp "$JAR" target/docker-app.jar
          ls -la target/docker-app.jar

      - name: Set lowercase image repository
        run: echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/spring-boot-guru
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-release:
    name: Publish to GitHub Packages Maven + Release
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Set Maven version
        run: ./mvnw -B versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Deploy to GitHub Packages
        run: ./mvnw -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect release JARs
        run: |
          JAR=$(ls target/spring-boot-guru-*.jar | grep -v -- -sources.jar | grep -v -- -javadoc.jar | head -1)
          SRC=$(ls target/*-sources.jar 2>/dev/null | head -1 || true)
          mkdir -p release-out
          cp "$JAR" release-out/
          if [ -n "$SRC" ] && [ -f "$SRC" ]; then cp "$SRC" release-out/; fi
          ls -la release-out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}

            ### GitHub Packages (Maven)

            Add repository and dependency (requires a PAT with `read:packages` for private repos):

            ```xml
            <repositories>
              <repository>
                <id>github</id>
                <url>https://maven.pkg.github.com/thanthtooaung-coding/spring-boot-guru</url>
              </repository>
            </repositories>

            <dependency>
              <groupId>com.alvin.springbootguru</groupId>
              <artifactId>spring-boot-guru</artifactId>
              <version>${{ steps.version.outputs.version }}</version>
            </dependency>
            ```

            Settings (`~/.m2/settings.xml`) server `github`: username = GitHub login, password = PAT with `read:packages`.

            ### JitPack

            ```xml
            <repositories>
              <repository>
                <id>jitpack.io</id>
                <url>https://jitpack.io</url>
              </repository>
            </repositories>

            <dependency>
              <groupId>com.github.thanthtooaung-coding</groupId>
              <artifactId>spring-boot-guru</artifactId>
              <version>${{ github.ref_name }}</version>
            </dependency>
            ```

            ### GHCR (library JAR inside image)

            `docker pull ghcr.io/thanthtooaung-coding/spring-boot-guru/spring-boot-guru:<tag>`
            JAR path in image: `/opt/spring-boot-guru/spring-boot-guru.jar`
          files: release-out/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
